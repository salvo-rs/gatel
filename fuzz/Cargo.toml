# Its own workspace on purpose: the fuzz targets need nightly and a linker
# flag, and neither should reach an ordinary `cargo build` of the gateway.
[package]
name = "gatel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

# Its own workspace, so `cargo build` at the top of the repository never tries
# to build something that needs nightly.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
bytes = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
gatel-plugin-runtime = { version = "2.0.0-alpha.1", path = "../crates/gatel-plugin-runtime" }
tokio = { version = "1", features = ["rt", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
gatel-password = { version = "2.0.0-alpha.1", path = "../crates/gatel-password", features = ["argon2"] }
gatel-cgi-protocol = { version = "2.0.0-alpha.1", path = "../crates/gatel-cgi-protocol" }
libfuzzer-sys = "0.4"
gatel-kdl = { version = "2.0.0-alpha.1", path = "../crates/gatel-kdl" }
gatel-model = { version = "2.0.0-alpha.1", path = "../crates/gatel-model" }
gatel-plan = { version = "2.0.0-alpha.1", path = "../crates/gatel-plan" }
gatel-bundle-std = { version = "2.0.0-alpha.1", path = "../crates/gatel-bundle-std" }
salvo_core = { version = "1.0", default-features = false }
http = "1"

[[bin]]
name = "request_decode"
path = "fuzz_targets/request_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kdl_frontend"
path = "fuzz_targets/kdl_frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_header"
path = "fuzz_targets/range_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matchers"
path = "fuzz_targets/matchers.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "snapshot_codec"
path = "fuzz_targets/snapshot_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cgi_protocol"
path = "fuzz_targets/cgi_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "password_policy"
path = "fuzz_targets/password_policy.rs"
test = false
doc = false
bench = false
