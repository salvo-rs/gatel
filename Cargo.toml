[workspace]
resolver = "3"
members = [
    "plugins/decode",
    "crates/gatel-password",
    "crates/gatel-process-windows",
    "plugins/cgi",
    "crates/gatel-cgi-http",
    "plugins/scgi",
    "plugins/fastcgi",
    "crates/gatel-cgi-protocol",
    "plugins/maintenance",
    "crates/gatel",
    "crates/gatel-model",
    "crates/gatel-plugin-api",
    "crates/gatel-plugin-runtime",
    "crates/gatel-macros",
    "crates/gatel-kdl",
    "crates/gatel-plan",
    "crates/gatel-observe",
    "crates/gatel-state",
    "crates/gatel-http",
    "crates/gatel-tls",
    "crates/gatel-bundle-std",
    "xtask",
]
# Needs nightly and a linker that ordinary builds do not want.
exclude = ["fuzz"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/salvo-rs/gatel"
homepage = "https://github.com/salvo-rs/gatel"
readme = "README.md"

[workspace.dependencies]
gatel-password = { version = "2.0.0-alpha.1", path = "crates/gatel-password" }
gatel-cgi-http = { version = "2.0.0-alpha.1", path = "crates/gatel-cgi-http" }
gatel-cgi-protocol = { version = "2.0.0-alpha.1", path = "crates/gatel-cgi-protocol" }
gatel-plugin-runtime = { version = "2.0.0-alpha.1", path = "crates/gatel-plugin-runtime" }
gatel-plugin-api = { version = "2.0.0-alpha.1", path = "crates/gatel-plugin-api" }
gatel-model = { version = "2.0.0-alpha.1", path = "crates/gatel-model" }
gatel-macros = { version = "2.0.0-alpha.1", path = "crates/gatel-macros" }
gatel-kdl = { version = "2.0.0-alpha.1", path = "crates/gatel-kdl" }
gatel-plan = { version = "2.0.0-alpha.1", path = "crates/gatel-plan" }
gatel-observe = { version = "2.0.0-alpha.1", path = "crates/gatel-observe" }
gatel-state = { version = "2.0.0-alpha.1", path = "crates/gatel-state" }
gatel-http = { version = "2.0.0-alpha.1", path = "crates/gatel-http" }
gatel-tls = { version = "2.0.0-alpha.1", path = "crates/gatel-tls" }
gatel-bundle-std = { version = "2.0.0-alpha.1", path = "crates/gatel-bundle-std" }

async-trait = "0.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
certon = { version = "0.3.0", default-features = false, features = ["ring"] }
blake3 = "1.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
futures-util = "0.3"
http = "1"
httpdate = "1.0.3"
url = "2.5.8"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
kdl = "6"
notify = "8"
pin-project-lite = "0.2"
proc-macro2 = "1"
quote = "1"
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
webpki-roots = "1.0.10"
salvo_core = { version = "0.96", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
