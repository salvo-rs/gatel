[workspace]
resolver = "3"
members = [
    "crates/gatel",
    "crates/gatel-model",
    "crates/gatel-macros",
    "crates/gatel-kdl",
    "crates/gatel-plan",
    "crates/gatel-state",
    "crates/gatel-http",
    "crates/gatel-tls",
    "crates/gatel-bundle-std",
    "xtask",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/salvo-rs/gatel"
homepage = "https://github.com/salvo-rs/gatel"
readme = "README.md"

[workspace.dependencies]
gatel-model = { version = "2.0.0-alpha.1", path = "crates/gatel-model" }
gatel-macros = { version = "2.0.0-alpha.1", path = "crates/gatel-macros" }
gatel-kdl = { version = "2.0.0-alpha.1", path = "crates/gatel-kdl" }
gatel-plan = { version = "2.0.0-alpha.1", path = "crates/gatel-plan" }
gatel-state = { version = "2.0.0-alpha.1", path = "crates/gatel-state" }
gatel-http = { version = "2.0.0-alpha.1", path = "crates/gatel-http" }
gatel-tls = { version = "2.0.0-alpha.1", path = "crates/gatel-tls" }
gatel-bundle-std = { version = "2.0.0-alpha.1", path = "crates/gatel-bundle-std" }

async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zstd", "deflate"] }
blake3 = "1.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
kdl = "6"
notify = "8"
pin-project-lite = "0.2"
proc-macro2 = "1"
quote = "1"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
webpki-roots = "1"
salvo_core = { version = "0.96", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
