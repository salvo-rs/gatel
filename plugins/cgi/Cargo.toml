[package]
name = "gatel-cgi"
description = "Supervised process CGI exchange primitives for Gatel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[test]]
name = "process_job"
path = "tests/process_job.rs"
harness = false

[dependencies]
gatel-cgi-protocol.workspace = true
gatel-cgi-http.workspace = true
gatel-plugin-runtime.workspace = true
futures-util.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
tokio = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
gatel-process-windows = { path = "../../crates/gatel-process-windows" }
tokio = { workspace = true, features = ["process"] }
