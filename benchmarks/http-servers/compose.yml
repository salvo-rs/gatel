name: gatel-http-bench

# One image for both gatel services, and it is the repository's own
# `Dockerfile` rather than a benchmark-only one. Measuring an image built
# differently from the one people run would tell us about the build, not about
# the gateway.
x-gatel-image: &gatel-image
  image: gatel-http-bench-gatel:local
  build:
    context: ../..
    dockerfile: Dockerfile

services:
  # Where `wrk` runs. Kept in its own container so the load generator competes
  # with the servers for CPU the same way for every target.
  bench:
    image: gatel-http-bench-runner:local
    build:
      context: .
      dockerfile: Runner.Dockerfile
    volumes:
      - ./fixtures/range-64k.lua:/workspace/range-64k.lua:ro
      - ./fixtures/range-offset-64k.lua:/workspace/range-offset-64k.lua:ro
      - ./fixtures/range-65k.lua:/workspace/range-65k.lua:ro

  # The origin behind every proxy target, so all three proxy the same thing.
  backend:
    image: nginx:1.27
    volumes:
      - ./configs/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/www:/srv/www:ro

  gatel-static:
    <<: *gatel-image
    # Readiness is checked by the harness; image probes would add traffic only
    # to Gatel and the benchmark configuration has no health endpoint.
    healthcheck:
      disable: true
    volumes:
      - ./configs/gatel-static.kdl:/etc/gatel/gatel.kdl:ro
      - ./fixtures/www:/srv/www:ro

  nginx-static:
    image: nginx:1.27
    volumes:
      - ./configs/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/www:/srv/www:ro

  caddy-static:
    image: gatel-http-bench-caddy:local
    build:
      context: .
      dockerfile: CaddyBench.Dockerfile
    volumes:
      - ./configs/Caddyfile.static:/etc/caddy/Caddyfile:ro
      - ./fixtures/www:/srv/www:ro

  gatel-proxy:
    <<: *gatel-image
    healthcheck:
      disable: true
    volumes:
      - ./configs/gatel-proxy.kdl:/etc/gatel/gatel.kdl:ro
    depends_on:
      - backend

  # Not part of a benchmark run. A scratch service for reproducing something
  # against a variant configuration: point it at whatever file the question is
  # about and bring it up on its own.
  gatel-scratch:
    <<: *gatel-image
    profiles: ["debug"]
    volumes:
      - ./configs/gatel-proxy-debug.kdl:/etc/gatel/gatel.kdl:ro
    depends_on:
      - backend

  nginx-proxy:
    image: nginx:1.27
    volumes:
      - ./configs/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  caddy-proxy:
    image: gatel-http-bench-caddy:local
    build:
      context: .
      dockerfile: CaddyBench.Dockerfile
    volumes:
      - ./configs/Caddyfile.proxy:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
