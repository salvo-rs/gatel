[package]
name = "gatel"
description = "A programmable gateway with a readable configuration and transactional reloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "gatel"
path = "src/main.rs"

[dependencies]
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
subtle = { version = "2.6.1", optional = true }
serde_json = { workspace = true, optional = true }
async-compression.workspace = true
gatel-decode = { version = "2.0.0-alpha.1", path = "../../plugins/decode", optional = true }
gatel-cgi = { version = "2.0.0-alpha.1", path = "../../plugins/cgi", optional = true }
gatel-scgi = { version = "2.0.0-alpha.1", path = "../../plugins/scgi", optional = true }
gatel-fastcgi = { version = "2.0.0-alpha.1", path = "../../plugins/fastcgi", optional = true }
gatel-maintenance = { version = "2.0.0-alpha.1", path = "../../plugins/maintenance", optional = true }
gatel-bundle-std.workspace = true
gatel-http.workspace = true
gatel-kdl.workspace = true
gatel-model.workspace = true
gatel-observe.workspace = true
gatel-plan.workspace = true
gatel-state.workspace = true
gatel-tls.workspace = true

clap.workspace = true
gatel-password.workspace = true
zeroize = "1"
clap_complete.workspace = true
clap_mangen.workspace = true
notify.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
admin-api = ["dep:bytes", "dep:http", "dep:http-body", "dep:http-body-util", "dep:subtle", "dep:hyper", "dep:hyper-util", "dep:serde_json"]
decode = ["dep:gatel-decode"]
argon2 = ["gatel-password/argon2", "gatel-bundle-std/argon2"]
cgi = ["dep:gatel-cgi"]
scgi = ["dep:gatel-scgi"]
fastcgi = ["dep:gatel-fastcgi"]
default = []
maintenance = ["dep:gatel-maintenance"]

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
bcrypt.workspace = true
rcgen.workspace = true
