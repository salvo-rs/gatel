[package]
name = "gatel-bundle-std"
description = "Gatel's standard directives: routing terminals, guards, and the observability endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gatel-model.workspace = true
gatel-macros.workspace = true
gatel-observe.workspace = true
gatel-plan.workspace = true

async-compression.workspace = true
gatel-password.workspace = true
bytes.workspace = true
http.workspace = true
httpdate.workspace = true
url.workspace = true
futures-util.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
pin-project-lite.workspace = true
salvo_core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
bcrypt.workspace = true
# `start_paused` lets the timeout tests run in milliseconds rather than minutes.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
argon2 = ["gatel-password/argon2"]
