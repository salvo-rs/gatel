[package]
name = "gatel-http"
description = "Gatel's HTTP data plane: listeners, routing, and the reverse proxy terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gatel-model.workspace = true
gatel-observe.workspace = true
gatel-plan.workspace = true
gatel-state.workspace = true
gatel-tls.workspace = true

bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["server-graceful"] }
pin-project-lite.workspace = true
salvo_core.workspace = true
socket2 = { version = "0.6", features = ["all"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
gatel-decode = { version = "2.0.0-alpha.1", path = "../../plugins/decode" }
async-compression.workspace = true
gatel-cgi-http.workspace = true
gatel-cgi = { version = "2.0.0-alpha.1", path = "../../plugins/cgi" }
gatel-scgi = { version = "2.0.0-alpha.1", path = "../../plugins/scgi" }
gatel-fastcgi = { version = "2.0.0-alpha.1", path = "../../plugins/fastcgi" }
bcrypt.workspace = true
# `start_paused` lets the watchdog tests run in milliseconds rather than minutes.
tokio = { workspace = true, features = ["test-util"] }
# `x509-parser` only for the test authority, which has to read a real CSR.
rcgen = { workspace = true, features = ["x509-parser"] }
gatel-bundle-std.workspace = true
gatel-kdl.workspace = true
# A backend that only speaks TLS, for the upstream-TLS tests.
rustls.workspace = true
tokio-rustls.workspace = true
# A certificate authority small enough to run in a test needs to read JWS.
base64 = "0.23"
serde_json.workspace = true

[[test]]
name = "cgi_process"
path = "tests/cgi_process.rs"
harness = false
