name: Eager file buffer same-host A/B validation (one-off)
on:
  push:
    branches: [bench/file-eager-ab-20261029]
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1bbdebfb67a9611e56f798ae9f3afd7275743eb1
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 6568aad8046f74c71155c4236a412f9a4ac667db
          path: candidate
          persist-credentials: false
      - name: Record remote host and Docker storage
        shell: bash
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/file-eager-ab"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          {
            uname -a
            lscpu
            free -h
            docker info
            docker buildx ls
            df -h "$(docker info --format '{{.DockerRootDir}}')"
            git -C source rev-parse HEAD
            git -C candidate rev-parse HEAD
            git -C orchestration rev-parse HEAD
          } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Build both revisions with the unchanged production Dockerfile
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/file-eager-ab.py build
      - name: Validate all scenes and long-duration large-file tails on this machine
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/file-eager-ab.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: file-eager-ab
          path: ${{ runner.temp }}/file-eager-ab
          if-no-files-found: error

