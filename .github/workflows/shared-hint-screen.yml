name: Share the file output hint owner three-arm screen (one-off)
on:
  push:
    branches: [bench/file-output-shared-hint-screen-20261030]
permissions:
  contents: read
  actions: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f0bee4835423e9c0084dff50ceac2fa95e634d9e
          path: candidate
          persist-credentials: false
      - name: Record remote host and storage
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/shared-hint-screen"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Verify the exact final A/B binaries and build the common client
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/shared-hint-screen.py build
      - name: Palindromic baseline, prior candidate and shared-owner candidate screen
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/shared-hint-screen.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-hint-screen
          path: |
            ${{ runner.temp }}/shared-hint-screen
            !${{ runner.temp }}/shared-hint-screen/protocol-controls/tls/key.pem
          if-no-files-found: error
