name: Validate plaintext file policy and native TLS transport (one-off)
on:
  push:
    branches: [bench/file-output-native-tls-validation-20261030]
permissions:
  contents: read
  actions: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 2df69fb23efc98812aef15c3b0d4c40d72103a5c
          path: candidate
          persist-credentials: false
      - name: Record remote host and storage
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/tls-raw-validation"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Verify the exact final A/B binaries and build the common client
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/tls-raw-validation.py build
      - uses: actions/upload-artifact@v7
        with:
          name: tls-raw-production-build
          path: ${{ runner.temp }}/tls-raw-validation
      - name: Plaintext regression controls
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/tls-raw-validation.py measure
      - name: Same-host H2c plus symmetric eight-phase TLS controls
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/tls-raw-protocols.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tls-raw-validation
          path: |
            ${{ runner.temp }}/tls-raw-validation
            !${{ runner.temp }}/tls-raw-validation/protocol-controls/tls/key.pem
          if-no-files-found: error
