name: Independent native H1 TLS small-file controls (one-off)
on:
  push:
    branches: [bench/file-output-native-h1small-20261030]
permissions:
  contents: read
  actions: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - name: Record remote host and storage
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/native-h1small"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Verify the exact final A/B binaries and build the common client
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/native-h1small-build.py build
      - name: Eight symmetric native H1 TLS phases with longer warmup and samples
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/native-h1small.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-h1small
          path: |
            ${{ runner.temp }}/native-h1small
            !${{ runner.temp }}/native-h1small/protocol-controls/tls/key.pem
          if-no-files-found: error
