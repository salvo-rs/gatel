name: Proxy cancellation and file delivery same-host A/B validation (one-off)
on:
  push:
    branches: [bench/proxy-range-tail-ab-20261029]
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 24b02901b7155f0873b6da99c9cee09b5fa1d6f1
          path: candidate
          persist-credentials: false
      - name: Record remote host and Docker storage
        shell: bash
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/proxy-range-tail-ab"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          {
            uname -a
            lscpu
            free -h
            docker info
            docker buildx ls
            df -h "$(docker info --format '{{.DockerRootDir}}')"
            git -C source rev-parse HEAD
            git -C candidate rev-parse HEAD
            git -C orchestration rev-parse HEAD
          } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Build both revisions with the unchanged production Dockerfile
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/proxy-range-tail-ab.py build
      - name: Validate all scenes and long-duration large-file tails on this machine
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/proxy-range-tail-ab.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proxy-range-tail-ab
          path: ${{ runner.temp }}/proxy-range-tail-ab
          if-no-files-found: error

