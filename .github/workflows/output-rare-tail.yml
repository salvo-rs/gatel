name: Investigate unchanged-path rare tail signal (one-off)
on:
  push:
    branches: [bench/file-output-rare-tail-20261030]
permissions:
  contents: read
  actions: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - name: Record remote host and storage
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/output-rare-tail"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Verify the exact final A/B binaries and build the common client
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/output-rare-tail.py build
      - name: Symmetric ABBA BAAB long 8MiB-1 and 1MiB controls
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/output-rare-tail.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: output-rare-tail
          path: |
            ${{ runner.temp }}/output-rare-tail
            !${{ runner.temp }}/output-rare-tail/protocol-controls/tls/key.pem
          if-no-files-found: error
