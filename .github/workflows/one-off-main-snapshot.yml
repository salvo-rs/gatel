name: Main three-server benchmark snapshot (one-off)

on:
  push:
    branches: [bench/http-servers-main-20261029-d5a11f3]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d5a11f3e2c35ca03e280671c9e6d47250723f337
          path: source
          persist-credentials: false
      - name: Record remote builder storage and environment
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/http-servers-main-20261029"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -h
            docker version
            docker info
            docker buildx ls
            benchmark_docker_root=$(docker info --format '{{.DockerRootDir}}')
            df -h "$benchmark_docker_root"
          } > "$BENCHMARK_OUTPUT/environment.txt" 2>&1
      - name: Check the main benchmark harness
        working-directory: source
        run: python3 -B -m unittest discover -s benchmarks/http-servers -p 'test_*.py'
      - name: Build the production and reference images on this remote runner
        working-directory: source/benchmarks/http-servers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -c 'import run; run.ensure_payloads()'
          docker compose build bench gatel-static caddy-static
          docker compose pull backend nginx-static nginx-proxy
          docker image inspect gatel-http-bench-gatel:local gatel-http-bench-caddy:local gatel-http-bench-runner:local nginx:1.27 > "$BENCHMARK_OUTPUT/image-inspect.json"
      - name: Compare nine workloads with balanced target order
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -u ../orchestration/.github/scripts/launch-main-server-snapshot.py 2>&1 | tee "$BENCHMARK_OUTPUT/run.log"
      - name: Preserve reports, raw rounds, preflights and resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-servers-main-20261029
          path: ${{ runner.temp }}/http-servers-main-20261029
          if-no-files-found: error
