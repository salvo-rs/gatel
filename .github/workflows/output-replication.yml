name: Independent host file-read admission replication (one-off)
on:
  push:
    branches: [bench/file-read-output-replication-20261029]
permissions:
  contents: read
  actions: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: f11ffccdaaae6249c1f779160b5b84af1f479ae6
          path: source
          persist-credentials: false
      - name: Record remote host and storage
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/output-replication"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          test "$GITHUB_ACTIONS" = true
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
      - name: Verify the exact final A/B binaries and build the common client
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/output-replication.py build
      - name: Balanced critical file and offset Range controls
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/output-replication.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: output-replication
          path: |
            ${{ runner.temp }}/output-replication
            !${{ runner.temp }}/output-replication/protocol-controls/tls/key.pem
          if-no-files-found: error
