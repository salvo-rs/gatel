name: Release

# A release workflow that has never run is a release workflow that does not
# work. Everything here except pushing and signing also runs on every push, in
# `ci.yml`'s `package` job, so a tag finds a path that was exercised yesterday.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the crates to crates.io as well"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz, cross: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, archive: tar.gz, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || false }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p gatel
          else
            cargo build --release --locked --target ${{ matrix.target }} -p gatel
          fi

      # The tag is the source of the name; a manual run gets the version the
      # workspace declares, so an artefact is never called "refs/heads/main".
      - name: Decide the name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          fi
          echo "archive=gatel-${version}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="${{ steps.name.outputs.archive }}"
          mkdir -p "$staging"
          # One binary, and the two files anyone unpacking this will look for.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/gatel.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/gatel" "$staging/"
          fi
          cp LICENSE README.md "$staging/"
          cp -r examples "$staging/examples"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$staging.zip" "$staging" >/dev/null
          else
            tar czf "$staging.tar.gz" "$staging"
          fi

      # A binary that cannot start is worth finding here rather than in a
      # bug report. Not run for a cross build, which cannot execute.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/gatel"
          [ "${{ matrix.archive }}" = "zip" ] && binary="$binary.exe"
          "$binary" --version
          "$binary" capabilities | grep -q "file-server"
          "$binary" validate examples/minimal.kdl

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.archive }}
          path: ${{ steps.name.outputs.archive }}.*
          if-no-files-found: error

  container:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gatel-*-linux-musl

      # Static musl binaries, so the image can be `scratch` and carry nothing
      # an advisory could ever be filed against. musl resolves DNS itself
      # rather than through NSS, which is what makes a static build able to
      # reach a backend by name at all.
      - name: Lay out the binaries
        run: |
          set -euo pipefail
          mkdir -p context/linux/amd64 context/linux/arm64
          tar xzf artifacts/*x86_64-unknown-linux-musl/*.tar.gz --strip-components=1 \
            -C context/linux/amd64
          tar xzf artifacts/*aarch64-unknown-linux-musl/*.tar.gz --strip-components=1 \
            -C context/linux/arm64
          chmod +x context/linux/amd64/gatel context/linux/arm64/gatel

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # The binaries laid out above, rather than a second build of the same
          # commit: the image then ships exactly what was built, smoke-tested
          # and checksummed by the `build` job. Without this the arm64 image
          # would be compiled under QEMU for no reason, and would not be the
          # artefact anyone tested.
          build-args: |
            SOURCE=prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [build, container]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign, keyless
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gatel-*

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release/ \;
          ls -l release

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/gatel-${{ github.ref_name }}-sbom.spdx.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS
          # Verify what was just written, so a corrupt upload is caught here.
          sha256sum --check --ignore-missing SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's identity, so a
      # verifier checks who built it rather than who holds a key.
      - name: Sign the checksums
        run: |
          cosign sign-blob --yes release/SHA256SUMS \
            --output-signature release/SHA256SUMS.sig \
            --output-certificate release/SHA256SUMS.pem

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: crates.io
    # Manual branch runs do not create a tag-only GitHub release. Depend on
    # their verified artifacts directly so publishing is not silently skipped.
    needs: [build, container]
    # Never on its own. Publishing cannot be undone, so it is a decision rather
    # than a consequence of tagging.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the complete publication graph
        run: |
          set -euo pipefail
          cargo run -p xtask --locked -- publish-plan > publish-plan.txt
          test -s publish-plan.txt

      # Derived from Cargo metadata, including plugins and target/optional
      # prerequisites. Fail before any upload if the graph is incomplete.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r crate; do
            echo "::group::$crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done < publish-plan.txt
