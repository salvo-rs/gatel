name: Fresh-process large-file tail with verified production binaries (one-off)
on:
  push:
    branches: [bench/file-fresh-tail-20261029]
permissions:
  contents: read
  actions: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1bbdebfb67a9611e56f798ae9f3afd7275743eb1
          path: source
          persist-credentials: false
      - name: Record remote environment
        run: |
          set -euo pipefail
          export BENCHMARK_OUTPUT="$RUNNER_TEMP/file-fresh-tail"
          echo "BENCHMARK_OUTPUT=$BENCHMARK_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_OUTPUT"
          { uname -a; lscpu; docker info; df -h "$(docker info --format '{{.DockerRootDir}}')"; } > "$BENCHMARK_OUTPUT/environment.txt"
          command -v nsenter
          command -v ss
      - name: Repackage verified original production binaries
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -u ../orchestration/.github/scripts/file-fresh-tail.py build
      - name: Resolve extreme latency with done-only histogram reporting
        working-directory: source
        run: python3 -B -u ../orchestration/.github/scripts/file-fresh-tail.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: file-fresh-tail
          path: ${{ runner.temp }}/file-fresh-tail
          if-no-files-found: error

