name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  schedule:
    # Nightly, for the jobs that are worth an hour rather than a minute.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Default features
        run: cargo test --workspace --all-targets --locked
      - name: All optional plugins
        run: cargo test --workspace --all-features --all-targets --locked

  plugin-features:
    name: standalone plugin (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [maintenance, fastcgi, scgi, cgi, decode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile and validate each plugin in isolation
        run: cargo test -p gatel --no-default-features --features ${{ matrix.feature }} --test plugins --locked
      - name: Other protocol plugins must not enter the production dependency tree
        env:
          SELECTED_PLUGIN: ${{ matrix.feature }}
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree -p gatel --no-default-features --features "$SELECTED_PLUGIN" -e normal --prefix none --locked)
          for plugin in maintenance fastcgi scgi cgi decode; do
            if [ "$plugin" != "$SELECTED_PLUGIN" ] && grep -q "^gatel-$plugin " <<< "$tree"; then
              echo "Unexpected production dependency: gatel-$plugin"
              exit 1
            fi
          done
          if grep -q '^argon2 ' <<< "$tree"; then
            echo "Unexpected Argon2 dependency in standalone plugin host"
            exit 1
          fi

  password-interop:
    name: password policy and PHP interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Minimal host capabilities and password CLI
        run: cargo test -p gatel --no-default-features --test plugins --test passwd --locked
      - name: Argon2-only host capabilities and password CLI
        run: cargo test -p gatel --no-default-features --features argon2 --test plugins --test passwd --locked
      - name: Default host must not link optional password algorithms
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree -p gatel -e normal --prefix none --locked)
          if grep -Eq '^(argon2|password-hash|phc) ' <<< "$tree"; then
            echo "Optional password algorithm leaked into the default host"
            exit 1
          fi
      - name: Fetch the explicitly pinned independent implementation
        run: docker pull php@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
      - name: Verify bcrypt and Argon2id in both directions
        timeout-minutes: 5
        run: cargo test -p gatel-password --features argon2 --test php_interop --locked -- --ignored --nocapture

  fastcgi-interop:
    name: FastCGI and real PHP-FPM interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the pinned isolated PHP-FPM fixture
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          docker create --name gatel-php-fpm --publish 127.0.0.1::9000 php@sha256:59fa733c9af643a122f8a9976119460e35ce76dd0a3f2b9c8f75af8e361a54e2
          docker cp plugins/fastcgi/examples gatel-php-fpm:/app
          docker start gatel-php-fpm
          ready=false
          for attempt in $(seq 1 30); do
            if docker logs gatel-php-fpm 2>&1 | grep -q 'ready to handle connections'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs gatel-php-fpm
            exit 1
          fi
          echo "GATEL_PHP_FPM_ADDR=$(docker port gatel-php-fpm 9000)" >> "$GITHUB_ENV"
      - name: Verify transport against PHP-FPM
        run: cargo test -p gatel-fastcgi --test exchange real_php_fpm_transport --locked -- --ignored
      - name: Verify HTTP GET, POST and HEAD against PHP-FPM
        run: cargo test -p gatel-http --test fastcgi real_php_fpm_get_post_and_head --locked -- --ignored
      - name: Fixture logs
        if: failure()
        run: docker logs gatel-php-fpm
      - name: Remove only this job's fixture
        if: always()
        run: docker rm -f gatel-php-fpm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked
      # Layering and file size are architectural rules, so they gate like a test.
      - run: cargo run -p xtask

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets --locked

  # What the tree contains, rather than how it is arranged: an advisory nobody
  # noticed, a licence nobody may ship, or a second copy of a crate that was
  # supposed to appear once.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  v1-compat:
    name: common HTTP profile against v1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the frozen v1 baseline
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/gatel-v1-target
          # Frozen historical code is a reference, not the current lint target.
          RUSTFLAGS: ""
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gatel-v1-source"
          git archive eaf9bdedd97c2ab24450becfff2a2a341dc5c3e2 | tar -x -C "$RUNNER_TEMP/gatel-v1-source"
          cargo build --manifest-path "$RUNNER_TEMP/gatel-v1-source/Cargo.toml" -p gatel --locked
      - name: Build v2 and compare real HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p gatel --locked
          python3 scripts/check-v1-compat.py --v1 "$RUNNER_TEMP/gatel-v1-target/debug/gatel" --v2 target/debug/gatel --work-dir "$RUNNER_TEMP/gatel-v1-compat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-compat-report
          path: ${{ runner.temp }}/gatel-v1-compat/

  # A few minutes each, on every push. That finds regressions rather than deep
  # bugs; a long run against a growing corpus is what finds those, and there is
  # no substitute for leaving one going. What this does guarantee is that the
  # targets still build and still pass over the corpus, which is how a fuzzing
  # setup usually dies: quietly, by rotting.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [kdl_frontend, configuration, range_header, matchers, snapshot_codec, cgi_protocol, password_policy, request_decode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=180
        working-directory: fuzz

      # An input that made it fall over is the whole point of running this.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/

  # Timed traffic/reload coverage complements the default identity-churn test.
  # A short run can reveal growth in this workload, not prove absence of leaks;
  # scheduled runs exercise the same workload for half an hour.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Soak
        env:
          GATEL_SOAK_SECONDS: ${{ github.event_name == 'schedule' && 1800 || 120 }}
        run: cargo test --release -p gatel-http --test soak --locked -- --ignored --nocapture

  # A release workflow nobody runs until a tag is a release workflow that is
  # discovered broken at the worst moment. This runs everything the tag would,
  # short of publishing: the same build, the same packaging, the same smoke
  # test on the binary that comes out.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p gatel

      - name: Package the way a release does
        run: |
          set -euo pipefail
          staging="gatel-ci-x86_64-unknown-linux-gnu"
          mkdir -p "$staging"
          cp target/release/gatel "$staging/"
          cp LICENSE README.md "$staging/"
          cp -r examples "$staging/examples"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" | tee SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test the binary that was packaged
        run: |
          set -euo pipefail
          ./target/release/gatel --version
          ./target/release/gatel capabilities | grep -q "file-server"
          ./target/release/gatel validate examples/minimal.kdl
          # `dry-run` compiles and binds, then exits. It is the check a
          # deployment runs before it swaps a process, so it is the check CI
          # should run before a release claims to work.
          ./target/release/gatel run examples/minimal.kdl --dry-run

      # The container image is part of the deliverable, so a Dockerfile that
      # does not build is a broken release. Built, not pushed.
      - uses: docker/setup-buildx-action@v3
      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: gatel:ci

      - name: The image serves
        run: |
          set -euo pipefail
          mkdir -p /tmp/conf
          cat > /tmp/conf/gatel.kdl <<'KDL'
          global { http ":8080" }
          site "*" { route "/" { respond "ok" }; route "/readyz" { health "ready"; } }
          KDL
          docker run -d --name gatel-ci -p 18080:8080 \
            -v /tmp/conf:/etc/gatel:ro gatel:ci
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:18080/ | grep -q ok; then
              docker exec gatel-ci /usr/local/bin/gatel probe
              docker rm -f gatel-ci
              exit 0
            fi
            sleep 1
          done
          echo "the image never answered"
          docker logs gatel-ci
          docker rm -f gatel-ci
          exit 1
